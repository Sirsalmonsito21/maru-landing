<style>

     Lienzo lógico 180×320 escalado ×6 = 1080×1920. La historia vive en STEPS (abajo): cada paso tiene su duración,

  :root { --k: #1a1422; --w: #FFF6EE; --shu: #C8452C; --mikan: #DE9A5A; --kin: #D7B98C; color-scheme: dark; }

  #textbox { left: 54px; right: 162px; top: 1236px; height: 246px; padding: 36px 42px; font-size: 52px; line-height: 1.32; z-index: 20; }
  #textbox .cur { display: inline-block; width: 28px; height: 28px; background: var(--w); margin-left: 10px; clip-path: polygon(0 0, 100% 0, 50% 100%); }

  { scene: "noche", enemy: "buho", dur: 2.6, text: "¡EL NOCTURNO reservó 3 citas!", face: "happy", fx: ["confetti", "leave"], hp: [.1, 0] },

  { scene: "ciudad", trans: { n: "", place: "", sub: "" }, dur: 1.2, loop: true },

let acc = 0; STEPS.forEach((s) => { s.t0 = acc; acc += s.dur; });

const ENEMIES = { info: ["EL «INFO»", "Nv.99"], audio: ["EL AUDIO ETERNO", "Nv.57"], buho: ["EL NOCTURNO", "Nv.2am"] };

/* ======================= DIBUJO ======================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

  for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
    if (!inE(x, y, cx, cy, rx, ry) || (keep && !keep(x, y))) continue;
    const edge = !inE(x - 1, y, cx, cy, rx, ry) || !inE(x + 1, y, cx, cy, rx, ry) || !inE(x, y - 1, cx, cy, rx, ry) || !inE(x, y + 1, cx, cy, rx, ry);

    for (let x = 0; x < 180; x++) px(x, y, (fr * 16 > BAYER[y % 4][x % 4]) && stops[i + 1] ? stops[i + 1] : stops[i]);
  }
}

const BUILD = []; { seed = 11; let x = 0; while (x < 180) { const w = 8 + Math.floor(rnd() * 14), h = 10 + Math.floor(rnd() * 26); BUILD.push({ x, w, h, win: Array.from({ length: 6 }, () => [Math.floor(rnd() * (w - 2)) + 1, Math.floor(rnd() * (h - 4)) + 2]) }); x += w + 1; } }

function drawAudio(x, y, t) {
  blob(x + 14, y + 8, 10, 9, "#9aa3b5", PAL.k);
  for (let j = 0; j < 16; j += 3) for (let i = 0; i < 20; i += 3) if (inE(x + 5 + i, y + j, x + 14, y + 8, 9, 8)) px(x + 5 + i, y + j, "#6c7488");
  rect(x + 4, y + 6, 21, 4, PAL.k); rect(x + 7, y + 7, 5, 2, "#3b4a78"); rect(x + 17, y + 7, 5, 2, "#3b4a78");
  rect(x + 11, y + 13, 6, 1, PAL.k); px(x + 16, y + 12, PAL.k);
  rect(x + 12, y + 17, 4, 6, "#3a2f47"); rect(x + 7, y + 23, 14, 2, "#3a2f47");
  if (Math.floor(t * 4) % 2) { rect(x + 27, y + 3, 1, 4, PAL.kin); rect(x + 30, y + 1, 1, 8, PAL.kin); }
}
function drawBuho(x, y, t) {
  blob(x + 13, y + 12, 12, 11, "#5b4a6e", PAL.k);
  blob(x + 13, y + 15, 7, 6, "#8a78a0", null);
  [[3, 1], [4, 2], [22, 1], [21, 2]].forEach(([i, j]) => px(x + i, y + j, PAL.k));
  blob(x + 8, y + 9, 4, 4, "#f2d27a", PAL.k); blob(x + 18, y + 9, 4, 4, "#f2d27a", PAL.k);
  rect(x + 8, y + 9, 2, 2, PAL.k); rect(x + 18, y + 9, 2, 2, PAL.k);
  px(x + 13, y + 12, PAL.o); px(x + 13, y + 13, PAL.o);
  rect(x + 16, y + 16, 7, 9, "#1a1422"); rect(x + 17, y + 17, 5, 7, Math.floor(t * 3) % 4 ? "#9fd3ff" : "#c8e8ff");
}
function enemy(st, lt, t) {
  if (!st.enemy) return null;
  const inK = st.fx?.includes("enter") ? outQ(p(lt, .3, .6)) : 1;
  let ex = 96 + Math.round((1 - inK) * 80), ey = 92;
  if (st.fx?.includes("shake") && lt > .3 && lt < .9) ex += Math.floor(lt * 30) % 2 ? 3 : -3;
  if (st.fx?.includes("hit") && lt > 1.35 && lt < 1.75 && Math.floor(lt * 20) % 2) return { x: ex, y: ey };
  if (st.fx?.includes("leave")) { const k = outQ(p(lt, 1.4, .8)); ex += Math.round(k * 90); ey -= lt > 1.4 ? Math.round(Math.abs(Math.sin(lt * 8)) * 3) : 0; }
  g.setTransform(2, 0, 0, 2, ex, ey);
  if (st.enemy === "info") drawInfo(0, 0);
  if (st.enemy === "audio") drawAudio(0, 0, t);
  if (st.enemy === "buho") drawBuho(0, 0, t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  return { x: ex, y: ey };
}

/* ---------- Mandarina con caras ---------- */
function face(expr, cx, cy, t) {
  const K = PAL.k;
  const pts = (arr) => arr.forEach(([x, y]) => px(cx + x, cy + y, K));
  if (expr === "sleep") pts([[-14, 2], [-13, 3], [-12, 2], [-9, 2], [-8, 3], [-7, 2]]);
  if (expr === "awake" || expr === "sad") { rect(cx - 14, cy + 1, 2, 2, K); rect(cx - 9, cy + 1, 2, 2, K); }
  if (expr === "happy" || expr === "level") pts([[-14, 2], [-13, 1], [-12, 2], [-9, 2], [-8, 1], [-7, 2], [-11, 5], [-10, 5]]);
  if (expr === "surprised") { rect(cx - 15, cy, 3, 3, K); rect(cx - 10, cy, 3, 3, K); px(cx - 15, cy, "#fff"); px(cx - 10, cy, "#fff"); rect(cx - 11, cy + 5, 2, 2, K); }
  if (expr === "think") { rect(cx - 13, cy, 2, 1, K); rect(cx - 8, cy, 2, 1, K); rect(cx - 11, cy + 5, 3, 1, K); }
  if (expr === "sad") { px(cx - 14, cy + 4, PAL.blue); px(cx - 14, cy + 5, PAL.blue); pts([[-11, 6], [-10, 5], [-9, 6]]); }
  if (expr === "dizzy") { const r = [[0, -1], [1, 0], [0, 1], [-1, 0]]; const k = Math.floor(t * 8) % 4; [[-13, 2], [-8, 2]].forEach(([ex, ey]) => r.forEach(([a, b], i) => { if (i !== k) px(cx + ex + a, cy + ey + b, K); })); }
  if (expr === "flat") { rect(cx - 15, cy + 2, 3, 1, K); rect(cx - 10, cy + 2, 3, 1, K); rect(cx - 12, cy + 5, 2, 1, K); }
  if (expr !== "xd") px(cx - 11, cy + 4, PAL.p);
}
function maru(st, lt, t) {
  const f = st.face || "sleep";
  const throwing = st.fx?.some((x) => x.startsWith("throw")) && lt > 1.0 && lt < 1.35;
  const jump = throwing ? -Math.round(Math.sin((lt - 1.0) / .35 * Math.PI) * 5) : 0;
  const push = st.fx?.includes("pushP") && lt > 1.2 && lt < 1.8 ? -Math.round(Math.sin((lt - 1.2) / .6 * Math.PI) * 6) : 0;
  const breathe = f === "sleep" ? Math.round(Math.sin(t * 2.6) * .6) : 0;
  const wx = 44 + push, wy = 168 + jump * 2;
  g.setTransform(2, 0, 0, 2, wx, wy);
  const cx = 0, cy = 0;
  blob(cx + 11, cy + 7, 7, 3, PAL.w, PAL.k);
  blob(cx, cy + breathe * .3, 15, 10, PAL.w, PAL.k);
  blob(cx + 7, cy - 5, 7, 5, PAL.o, null, (x, y) => inE(x, y, cx, cy, 14, 9));
  blob(cx + 13, cy + 7, 3, 2, PAL.o, null, (x, y) => inE(x, y, cx + 11, cy + 7, 6, 2));
  [[-15, -3], [-14, -4], [-14, -3], [-13, -2], [-7, -5], [-6, -4], [-7, -4], [-8, -3]].forEach(([x, y]) => px(cx + x, cy + y, PAL.k));
  blob(cx - 10, cy + 2, 7, 6, PAL.w, PAL.k);
  blob(cx - 7, cy - 2, 3, 2, PAL.o, null, (x, y) => inE(x, y, cx - 10, cy + 2, 6, 5));
  face(f, cx, cy, t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  return { x: wx, y: wy };
}

/* ---------- Efectos ---------- */
function projectile(kind, lt) {
  const k = p(lt, 1.02, .38); if (k <= 0 || k >= 1) return;
  const x = 64 + (122 - 64) * k, y = 160 - 46 * k - Math.sin(k * Math.PI) * 22;
  g.setTransform(2, 0, 0, 2, Math.round(x), Math.round(y));
  if (kind === "pdf") { rect(-4, -5, 8, 10, PAL.w); rect(-4, -5, 8, 1, PAL.k); rect(-4, 4, 8, 1, PAL.k); rect(-4, -5, 1, 10, PAL.k); rect(3, -5, 1, 10, PAL.k); rect(-2, -2, 4, 1, PAL.r); rect(-2, 0, 4, 1, PAL.k); rect(-2, 2, 3, 1, PAL.k); }
  if (kind === "bubble") { rect(-5, -3, 10, 6, PAL.w); rect(-5, -3, 10, 1, PAL.k); rect(-5, 2, 10, 1, PAL.k); rect(-5, -3, 1, 6, PAL.k); rect(4, -3, 1, 6, PAL.k); rect(-3, 0, 1, 1, PAL.k); rect(0, 0, 1, 1, PAL.k); rect(2, 0, 1, 1, PAL.k); }
  if (kind === "coupon") { rect(-6, -3, 12, 7, PAL.y); rect(-6, -3, 12, 1, PAL.k); rect(-6, 3, 12, 1, PAL.k); rect(-2, -1, 1, 3, PAL.r); rect(1, -1, 1, 3, PAL.r); }
  g.setTransform(1, 0, 0, 1, 0, 0);
}
function visto(lt, e) {
  if (!e || lt < .6) return;
  const x = e.x + 58, y = e.y + 34;
  g.setTransform(2, 0, 0, 2, x, y);
  [[0, 2], [1, 3], [2, 2], [3, 1], [4, 0]].forEach(([a, b]) => { px(a, b, PAL.blue); px(a + 4, b, PAL.blue); });
  g.setTransform(1, 0, 0, 1, 0, 0);
}
function rain(lt, m) {
  const cx = m.x - 20, cy = m.y - 34;
  blob(cx, cy, 10, 4, "#8a8fa6", "#4a4f66"); blob(cx + 7, cy - 2, 6, 4, "#8a8fa6", "#4a4f66");
  for (let i = 0; i < 6; i++) { const yy = cy + 5 + ((lt * 30 + i * 7) % 18); px(cx - 8 + i * 3, yy, PAL.blue); px(cx - 8 + i * 3, yy + 1, PAL.blue); }
}
function blockIcon(lt, e) {
  const k = outQ(p(lt, .9, .3)); if (k <= 0) return;
  const cx = e ? e.x + 28 : 124, cy = e ? e.y + 22 : 114, r = 22 * k;
  for (let y = -r - 2; y <= r + 2; y++) for (let x = -r - 2; x <= r + 2; x++) {
    const d = Math.hypot(x, y);
    if ((d <= r && d >= r - 4) || (Math.abs(x - y) < 3 && d < r)) px(cx + x, cy + y, "#e03b2c");
  }
}
function wave(lt) {
  const k = p(lt, .6, 1.6); if (k <= 0) return;
  const head = 180 - k * 260;
  for (let x = 0; x < 180; x += 3) {
    if (x < head) continue;
    const h = 3 + Math.abs(Math.sin(x * .7 + lt * 12)) * 12;
    rect(x, 150 - h / 2, 2, h, x % 6 ? PAL.kin : PAL.w);
  }
}
function sparks(lt, e) {
  const k = p(lt, 1.4, .45); if (k <= 0 || k >= 1 || !e) return;
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = 10 + k * 26; px(e.x + 28 + Math.cos(a) * r, e.y + 22 + Math.sin(a) * r * .8, i % 2 ? PAL.y : PAL.w); }
}
function confetti(lt) {
  for (let i = 0; i < 40; i++) {
    const x = (i * 37) % 180, y = ((lt * 60 + i * 23) % 200) - 40, c = [PAL.r, PAL.y, PAL.p, PAL.blue, "#6fd08c"][i % 5];
    if (y > 0) rect(x + Math.sin(lt * 5 + i) * 3, y, 2, 2, c);
  }
}
function levelStars(lt, m) {
  for (let i = 0; i < 8; i++) { const a = lt * 2 + i / 8 * Math.PI * 2, r = 30 + Math.sin(lt * 4) * 3; const x = m.x - 4 + Math.cos(a) * r, y = m.y + 4 + Math.sin(a) * r * .55; px(x, y, PAL.y); px(x + 1, y, PAL.y); px(x, y - 1, "#fff"); }
}

/* ---------- Transición de combate: bloques que cubren y revelan ---------- */
const ORDER = []; { seed = 29; for (let by = 0; by < 32; by++) for (let bx = 0; bx < 18; bx++) { const d = Math.hypot(bx - 8.5, by - 15.5) / 18; ORDER.push({ bx, by, o: clamp(d * .75 + rnd() * .25) }); } }
function blocks(k) {
  gb.clearRect(0, 0, 180, 320);
  gb.fillStyle = "#1a1422";
  ORDER.forEach((b) => { const on = k <= 1 ? b.o < k : b.o >= (k - 1); if (on) gb.fillRect(b.bx * 10, b.by * 10, 10, 10); });
}

/* ======================= RENDER ======================= */
function stepAt(t) { let i = 0; while (i < STEPS.length - 1 && t >= STEPS[i + 1].t0) i++; return i; }
function render(t) {
  const i = stepAt(t), st = STEPS[i], lt = t - st.t0, prev = STEPS[i - 1];
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 180, 320);

  /* Transición: cubre con bloques, muestra el cartel del lugar y revela el campo nuevo */
  const tr = st.trans;
  let covered = false, uncovering = false;
  if (tr) {
    const k = lt / st.dur, coverEnd = st.loop ? .5 : .3, uncoverStart = st.loop ? .5 : .72;
    const kb = k < coverEnd ? k / coverEnd : k < uncoverStart ? 1 : 1 + (k - uncoverStart) / (1 - uncoverStart);
    blocks(kb);
    covered = k < coverEnd; uncovering = k >= uncoverStart;
    $("card").style.opacity = !st.loop && k > coverEnd + .03 && k < uncoverStart - .03 ? 1 : 0;
    $("cardN").textContent = tr.n; $("cardP").textContent = tr.place; $("cardS").textContent = tr.sub;
  } else { blocks(0); $("card").style.opacity = 0; }

  /* Mientras se cubre se sigue viendo el combate anterior congelado; al revelar ya está el campo nuevo */
  const show = tr ? (covered ? prev : { scene: st.scene, face: st.scene === "noche" || st.loop ? "sleep" : "awake", fx: [] }) : st;
  const showLt = tr && covered ? prev.dur : lt;
  SCENES[show.scene](t);
  const e = show.enemy && !(tr && show.fx?.some((f) => f === "leave" || f === "block")) ? enemy(show, showLt, t) : null;
  const m = maru(show, showLt, t);

  const fx = tr ? [] : (st.fx || []);
  fx.forEach((f) => {
    if (f.startsWith("throw:")) projectile(f.split(":")[1], lt);
    if (f === "visto") visto(lt, e);
    if (f === "rain") rain(lt, m);
    if (f === "block") blockIcon(lt, e);
    if (f === "wave") wave(lt);
    if (f === "hit") sparks(lt, e);
    if (f === "confetti") confetti(lt);
    if (f === "level") levelStars(lt, m);
  });

  /* Cámara */
  const zoom = fx.includes("zoom") ? 1 + .45 * outQ(p(lt, .4, .5)) : 1;
  const shake = fx.includes("block") && lt > .9 && lt < 1.5 ? (Math.floor(lt * 30) % 2 ? 8 : -8) : 0;
  $("cam").style.transform = `translate(${shake}px, 0) scale(${zoom})`;
  $("flash").style.opacity = fx.includes("hit") && lt > 1.38 && lt < 1.5 ? .85 : 0;

  /* Placas y vida */
  const eKey = st.enemy || (tr && covered ? prev.enemy : null);
  const ename = ENEMIES[eKey] || ["", ""];
  $("eName").textContent = ename[0]; $("eLv").textContent = ename[1];
  let plate = 0;
  if (!tr && st.enemy) plate = (fx.includes("enter") ? outQ(p(lt, .9, .3)) : 1) * (fx.includes("leave") ? 1 - p(lt, 1.8, .3) : 1);
  if (tr && covered && prev.enemy && !prev.fx?.includes("leave")) plate = 1;
  $("plateE").style.opacity = plate;
  const hp = st.hp ? st.hp[0] + (st.hp[1] - st.hp[0]) * outQ(p(lt, 1.45, .5)) : 1;
  $("hpE").style.width = hp * 100 + "%";
  $("hpE").style.background = hp > .5 ? "#6fd08c" : hp > .2 ? "#f2d27a" : "#C8452C";
  $("plateP").style.opacity = 1;
  const lvlIdx = STEPS.findIndex((s) => s.fx?.includes("level"));
  $("pLv").textContent = i >= lvlIdx && !st.loop ? "Nv.2" : "Nv.1";
  $("hpP").style.width = fx.includes("pushP") ? (100 - 30 * outQ(p(lt, 1.3, .4))) + "%" : "100%";

  /* Caras en texto y globos */
  const face_ = show.face;
  $("zzz").style.opacity = face_ === "sleep" ? 1 : 0;
  $("zzz").style.left = (m.x + 8) * 6 + "px"; $("zzz").style.top = (m.y - 40 + Math.round(Math.sin(t * 2) * 2)) * 6 + "px";
  $("xd").style.opacity = face_ === "xd" ? 1 : 0;
  $("xd").style.left = (m.x - 31) * 6 + "px"; $("xd").style.top = (m.y - 4) * 6 + "px";
  $("think").style.opacity = fx.includes("think") ? outQ(p(lt, 1.2, .3)) : 0;
  $("cri").style.opacity = fx.includes("cri") ? (Math.floor(lt * 2) % 2 ? .9 : .5) * p(lt, .5, .3) : 0;

  /* Lo que dice el cliente */
  const w = fx.find((f) => f.startsWith("word:"));
  const word = $("word");
  word.textContent = w ? w.split(":")[1] : (e && show.enemy === "info" ? "info" : "");
  word.style.opacity = e && word.textContent ? 1 : 0;
  if (w) Object.assign(word.style, { background: "#FFF6EE", padding: "4px 14px", border: "6px solid #1a1422" });
  else Object.assign(word.style, { background: "none", padding: "0", border: "0" });
  if (e) { word.style.left = (e.x + 28) * 6 - word.offsetWidth / 2 + "px"; word.style.top = (w ? e.y - 14 : e.y + 1) * 6 + "px"; }

  /* Muro de la transcripción */
  $("wall").style.opacity = fx.includes("wall") ? outQ(p(lt, 1.1, .3)) : fx.includes("wallShrink") ? 1 - p(lt, 2.0, .3) : 0;
  $("wall").innerHTML = fx.includes("wallShrink") && lt > .8
    ? "…mire le cuento… mi prima… en Surco… el otro día… <em>¿cuánto el corte?</em>"
    : "«hola buenas mire le cuento que mi prima la que vive en Surco me dijo que ustedes atienden bien y justo el otro día pasaba por ahí y dije voy a preguntar pero no tenía saldo y entonces mi hermano me prestó el celular y le digo mire ¿cuánto el corte?»";

  /* Sello */
  const s = fx.includes("seal") ? p(lt, .8, .12) : 0;
  $("seal").style.opacity = s > 0 ? 1 : 0;
  $("seal").style.transform = `scale(${s < 1 ? 2.2 - 1.2 * s : 1}) rotate(-6deg)`;

  /* Diálogo o menú */
  $("menu").style.opacity = st.menu ? 1 : 0;
  $("menu").querySelector(".sel").style.color = st.menu && lt > 1.0 && Math.floor(lt * 10) % 2 ? "#C8452C" : "";
  $("textbox").style.opacity = st.menu ? 0 : 1;
  const txt = st.text || "";
  const n = Math.floor(Math.max(0, lt - .15) * 24);
  $("txt").textContent = txt.slice(0, n);
  $("cur").style.opacity = txt && n >= txt.length && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
}

/* ---------- Reproductor ---------- */
const REC = new URLSearchParams(location.search).has("rec");
if (REC) document.body.classList.add("rec");
function fit() { if (REC) return; const vp = $("viewport").getBoundingClientRect(); const s = Math.min(vp.width / 1080, vp.height / 1920) * .96; $("stage").style.transform = `translate(${-540 * s}px, ${-960 * s}px) scale(${s})`; }
addEventListener("resize", fit);
$("scrub").max = DURATION;
let playing = !REC, t0 = performance.now(), now = 0;
function show(t) { now = t; render(t); $("scrub").value = t; $("time").textContent = t.toFixed(2) + " / " + DURATION.toFixed(1) + " s"; }
function loop(ts) { if (playing) { let t = (ts - t0) / 1000; if (t >= DURATION) { t0 = ts; t = 0; } show(t); } requestAnimationFrame(loop); }
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pausa" : "Reproducir"; t0 = performance.now() - now * 1000; };
$("scrub").oninput = () => { playing = false; $("play").textContent = "Reproducir"; show(+$("scrub").value); };
window.__seek = (t) => show(t);
window.__duration = DURATION;
window.__ready = document.fonts.load("52px DotGothic16").then(() => document.fonts.ready).then(() => { fit(); show(0); return true; });
window.__ready.then(() => { t0 = performance.now(); requestAnimationFrame(loop); });
</script>
