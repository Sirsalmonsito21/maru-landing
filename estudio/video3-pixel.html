<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maru · Tipos de clientes (pixel)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* Borrador pixel art japonés: combate de RPG retro. Lienzo lógico 180×320 escalado ×6 = 1080×1920. */
  :root { --k: #1a1422; --w: #FFF6EE; --shu: #C8452C; --mikan: #DE9A5A; --kin: #D7B98C; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0a12; color: var(--w); font-family: "DotGothic16", monospace; }
  body { display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  .viewport { position: relative; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: #1d1633; }
  body.rec { display: block; }
  body.rec .viewport { position: static; overflow: visible; }
  body.rec #stage { left: 0; top: 0; transform: none !important; }
  body.rec .bar { display: none; }
  #px { position: absolute; inset: 0; width: 1080px; height: 1920px; image-rendering: pixelated; }
  .abs { position: absolute; }
  /* Scanlines tipo CRT, muy sutiles */
  #scan { inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.10) 0 3px, transparent 3px 6px); }
  #flash { inset: 0; background: #fff; opacity: 0; }

  /* Cajas estilo consola: doble borde, esquinas en escalón */
  .box {
    background: var(--k); color: var(--w);
    border: 6px solid var(--w); outline: 6px solid var(--k);
    box-shadow: inset 0 0 0 6px var(--k), inset 0 0 0 12px #5a4a6e;
  }
  #textbox { left: 54px; right: 162px; top: 1236px; height: 246px; padding: 38px 42px; font-size: 54px; line-height: 1.3; }
  #textbox .cur { display: inline-block; width: 30px; height: 30px; background: var(--w); margin-left: 8px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  #menu { left: 54px; right: 162px; top: 1236px; height: 246px; padding: 30px 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; font-size: 44px; align-content: center; opacity: 0; }
  #menu span { white-space: nowrap; }
  #menu .sel::before { content: "▶"; color: var(--shu); margin-right: 6px; }
  #menu span:not(.sel) { padding-left: 50px; color: #cfc3d8; }

  .plate { padding: 22px 30px 26px; }
  .plate .nm { font-size: 46px; display: flex; justify-content: space-between; gap: 24px; }
  .plate .lv { color: var(--kin); font-size: 38px; }
  .hp { margin-top: 14px; display: flex; align-items: center; gap: 14px; font-size: 32px; color: var(--mikan); }
  .hp .track { flex: 1; height: 24px; background: #3a2f47; border: 4px solid var(--w); }
  .hp .fill { height: 100%; background: #6fd08c; }
  #plateE { left: 54px; top: 250px; width: 560px; }
  #plateP { left: 540px; top: 1000px; width: 378px; }
  #zzz { left: 330px; top: 900px; font-size: 60px; color: var(--kin); }
  #bubbleTxt { font-size: 60px; color: var(--k); }
  #seal { right: 190px; top: 1150px; width: 150px; height: 150px; display: grid; place-items: center; background: var(--shu); color: var(--w); font-size: 104px; line-height: 1; border: 6px solid var(--k); box-shadow: 12px 12px 0 rgba(26,20,34,.6); opacity: 0; }
  #logo { left: 54px; top: 120px; font-size: 40px; letter-spacing: .12em; color: var(--kin); }
  #logo b { background: var(--shu); color: var(--w); padding: 2px 12px; margin-right: 16px; }

  .bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #1b1622; font: 14px system-ui; }
  .bar button { color: #F3EDE2; background: #3A342F; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .bar input { flex: 1; accent-color: #C8452C; }
  .bar output { min-width: 80px; color: #CFC5B8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="viewport" id="viewport"><div id="stage">
  <canvas id="px" width="180" height="320"></canvas>
  <div class="abs" id="logo"><b>丸</b>TIPOS DE CLIENTES Nº1</div>
  <div class="abs" id="bubbleTxt">info</div>
  <div class="abs box plate" id="plateE"><div class="nm"><span>EL «INFO»</span><span class="lv">Nv.99</span></div><div class="hp"><span>PS</span><div class="track"><div class="fill" id="hpE"></div></div></div></div>
  <div class="abs box plate" id="plateP"><div class="nm"><span>MARU</span><span class="lv">Nv.1</span></div><div class="hp"><span>PS</span><div class="track"><div class="fill" style="width:100%"></div></div></div></div>
  <div class="abs" id="zzz">z Z</div>
  <div class="abs box" id="textbox"><span id="txt"></span><span class="cur" id="cur"></span></div>
  <div class="abs box" id="menu"><span class="sel">RESPUESTA AUTO</span><span>PEDIR FOTO</span><span>AGENDAR</span><span>HUIR</span></div>
  <div class="abs" id="seal">丸</div>
  <div class="abs" id="flash"></div>
  <div class="abs" id="scan"></div>
</div></div>
<div class="bar">
  <button id="play" type="button">Pausa</button>
  <input id="scrub" type="range" min="0" max="5" step="0.01" value="0" aria-label="Posición">
  <output id="time">0.00 s</output>
</div>
<script>
const DURATION = 5;
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, s, d) => clamp((t - s) / d);
const outQ = (k) => 1 - (1 - k) ** 3;
const C = $("px"), g = C.getContext("2d");
g.imageSmoothingEnabled = false;
const PAL = { k: "#1a1422", w: "#FFF6EE", W: "#f3e6d8", o: "#DE9A5A", O: "#b86f35", r: "#C8452C", R: "#8e2f1f", p: "#F4C6C0", y: "#f2d27a", kin: "#D7B98C" };
const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); };
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); };
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const inE = (x, y, cx, cy, rx, ry) => ((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1;
function blob(cx, cy, rx, ry, fill, out, keep) {
  for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
    if (!inE(x, y, cx, cy, rx, ry) || (keep && !keep(x, y))) continue;
    const edge = !inE(x - 1, y, cx, cy, rx, ry) || !inE(x + 1, y, cx, cy, rx, ry) || !inE(x, y - 1, cx, cy, rx, ry) || !inE(x, y + 1, cx, cy, rx, ry);
    px(x, y, edge && out ? out : fill);
  }
}
let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

/* ---- Fondo fijo: atardecer, sol en franjas, nubes kin, ciudad con torii ---- */
const SKY = ["#1d1633", "#2c1b40", "#3f214a", "#5a2750", "#7a3050", "#9e3c4a", "#c65043", "#e0703f"];
const BUILD = []; { seed = 11; let x = 0; while (x < 180) { const w = 8 + Math.floor(rnd() * 14), h = 10 + Math.floor(rnd() * 26); BUILD.push({ x, w, h, win: Array.from({ length: 6 }, () => [Math.floor(rnd() * (w - 2)) + 1, Math.floor(rnd() * (h - 4)) + 2]) }); x += w + 1; } }
const PETALS = Array.from({ length: 18 }, () => ({ x: rnd() * 180, y: rnd() * 320, s: 10 + rnd() * 14, d: rnd() * 6 }));
function background(t) {
  for (let y = 0; y < 112; y++) {
    const f = y / 112 * (SKY.length - 1), i = Math.floor(f), fr = f - i;
    for (let x = 0; x < 180; x++) px(x, y, (fr * 16 > BAYER[y % 4][x % 4]) && SKY[i + 1] ? SKY[i + 1] : SKY[i]);
  }
  // Sol shu con franjas retro en la mitad baja
  for (let y = 62; y <= 118; y++) for (let x = 90; x <= 150; x++) {
    if (!inE(x, y, 120, 92, 27, 27)) continue;
    if (y > 92 && (y - 92) % 6 < (y - 92) / 9) continue;
    px(x, y, y < 80 ? "#e2623f" : "#C8452C");
  }
  // Nubes kin
  [[20, 70, 60], [34, 74, 40], [118, 58, 52], [132, 62, 34]].forEach(([x, y, w]) => rect(x, y, w, 2, PAL.kin));
  // Ciudad
  BUILD.forEach((b, j) => {
    rect(b.x, 112 - b.h, b.w, b.h, "#2a1f3d");
    b.win.forEach(([wx, wy], k) => { if ((Math.floor(t * 2 + j + k) % 7) !== 0) px(b.x + wx, 112 - b.h + wy, PAL.y); });
  });
  // Torii
  rect(16, 84, 30, 3, PAL.R); rect(13, 82, 36, 2, PAL.R); rect(20, 90, 22, 2, PAL.R); rect(21, 84, 3, 28, PAL.R); rect(38, 84, 3, 28, PAL.R);
  // Suelo de combate con franjas
  for (let y = 112; y < 320; y++) rect(0, y, 180, 1, y % 8 < 4 ? "#2b2338" : "#261f33");
  blob(124, 138, 38, 7, "#3d3150", "#1a1422");
  blob(46, 192, 44, 8, "#3d3150", "#1a1422");
  // Pétalos de sakura cayendo
  PETALS.forEach((q) => {
    const y = (q.y + t * q.s) % 320, x = (q.x + Math.sin(t * 2 + q.d) * 4 + t * 3) % 180;
    px(x, y, PAL.p); if ((Math.floor(t * 6 + q.d) % 2) === 0) px(x + 1, y, "#e89aa6");
  });
}

/* ---- Sprites ---- */
function enemy(t, dissolve) {
  const inK = outQ(p(t, .45, .45));
  let ex = 96 + Math.round((1 - inK) * 70), ey = 94;
  const hit = t > 3.35 && t < 3.65, shake = (t > 1.25 && t < 1.55) || hit;
  if (shake) ex += Math.floor(t * 40) % 2 ? 3 : -3;
  if (hit && Math.floor(t * 20) % 2) return { x: ex, y: ey, visible: false };
  g.setTransform(2, 0, 0, 2, ex, ey); const x = 0, y = 0;
  const keep = (px_, py_) => BAYER[py_ % 4][px_ % 4] >= dissolve * 16;
  // Globo con cola
  for (let j = 0; j < 20; j++) for (let i = 0; i < 28; i++) {
    const corner = (i < 2 && j < 2) || (i > 25 && j < 2) || (i < 2 && j > 17) || (i > 25 && j > 17);
    if (corner || !keep(x + i, y + j)) continue;
    const edge = i === 0 || j === 0 || i === 27 || j === 19 || (i === 1 && (j === 1 || j === 18)) || (i === 26 && (j === 1 || j === 18));
    px(x + i, y + j, edge ? PAL.k : PAL.w);
  }
  [[4, 20], [4, 21], [5, 20], [3, 22]].forEach(([i, j]) => keep(x + i, y + j) && px(x + i, y + j, PAL.k));
  // Cara: cejas enojadas y ojos
  if (dissolve < .5) {
    [[7, 9], [8, 10], [19, 10], [20, 9]].forEach(([i, j]) => px(x + i, y + j, PAL.k));
    rect(x + 7, y + 12, 2, 3, PAL.k); rect(x + 19, y + 12, 2, 3, PAL.k);
    rect(x + 12, y + 16, 4, 1, PAL.k);
    px(x + 5, y + 15, PAL.p); px(x + 22, y + 15, PAL.p);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  return { x: ex, y: ey, visible: true };
}
function cat(t) {
  const jump = t > 2.95 && t < 3.25 ? -Math.round(Math.sin((t - 2.95) / .3 * Math.PI) * 5) : 0;
  const breathe = Math.round(Math.sin(t * 2.6) * .6);
  const wx = 44, wy = 168 + jump * 2; g.setTransform(2, 0, 0, 2, wx, wy); const cx = 0, cy = 0;
  blob(cx + 11, cy + 7, 7, 3, PAL.w, PAL.k);                       // cola
  blob(cx, cy, 15, 10 + breathe * .3, PAL.w, PAL.k);               // cuerpo
  blob(cx + 7, cy - 5, 7, 5, PAL.o, null, (x, y) => inE(x, y, cx, cy, 14, 9)); // mancha del lomo
  blob(cx + 13, cy + 7, 3, 2, PAL.o, null, (x, y) => inE(x, y, cx + 11, cy + 7, 6, 2)); // punta de la cola
  // orejas
  [[cx - 15, cy - 3], [cx - 14, cy - 4], [cx - 14, cy - 3], [cx - 13, cy - 2]].forEach(([x, y]) => px(x, y, PAL.k));
  [[cx - 7, cy - 5], [cx - 6, cy - 4], [cx - 7, cy - 4], [cx - 8, cy - 3]].forEach(([x, y]) => px(x, y, PAL.k));
  blob(cx - 10, cy + 2, 7, 6, PAL.w, PAL.k);                        // cabeza
  blob(cx - 7, cy - 2, 3, 2, PAL.o, null, (x, y) => inE(x, y, cx - 10, cy + 2, 6, 5));
  // ojos cerrados (dormida)
  [[cx - 14, cy + 2], [cx - 13, cy + 3], [cx - 12, cy + 2], [cx - 9, cy + 2], [cx - 8, cy + 3], [cx - 7, cy + 2]].forEach(([x, y]) => px(x, y, PAL.k));
  px(cx - 11, cy + 5, PAL.p);
  g.setTransform(1, 0, 0, 1, 0, 0);
  return { cx: wx, cy: wy };
}
function projectile(t) {
  const k = p(t, 3.02, .33); if (k <= 0 || k >= 1) return;
  const x = 64 + (122 - 64) * k, y = 160 - (160 - 114) * k - Math.sin(k * Math.PI) * 22;
  rect(x - 5, y - 4, 11, 8, PAL.w); rect(x - 5, y - 4, 11, 1, PAL.k); rect(x - 5, y + 3, 11, 1, PAL.k); rect(x - 5, y - 4, 1, 8, PAL.k); rect(x + 5, y - 4, 1, 8, PAL.k);
  rect(x - 3, y - 1, 7, 1, PAL.r); rect(x - 3, y + 1, 5, 1, PAL.r);
}
function sparks(t) {
  const k = p(t, 3.35, .45); if (k <= 0 || k >= 1) return;
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2, r = 10 + k * 26, x = 124 + Math.cos(a) * r, y = 114 + Math.sin(a) * r * .8;
    px(x, y, i % 2 ? PAL.y : PAL.w); px(x + 1, y, PAL.y);
  }
}

/* ---- Texto de diálogo con máquina de escribir ---- */
const LINES = [
  [0.15, "¡Un cliente salvaje apareció!"],
  [1.25, "EL «INFO» solo escribió: info"],
  [2.05, null], // menú
  [2.8, "¡MARU usó RESPUESTA AUTOMÁTICA!"],
  [3.6, "¡Es súper efectivo!"],
  [4.25, "¡EL «INFO» fue atendido!"],
];
function dialog(t) {
  let cur = LINES[0];
  LINES.forEach((l) => { if (t >= l[0]) cur = l; });
  const menuOn = cur[1] === null;
  $("menu").style.opacity = menuOn ? 1 : 0;
  $("textbox").style.opacity = menuOn ? 0 : 1;
  if (menuOn) { $("menu").querySelector(".sel").style.color = t > 2.6 && Math.floor(t * 12) % 2 ? "#C8452C" : ""; return; }
  const n = Math.floor((t - cur[0]) * 38);
  $("txt").textContent = cur[1].slice(0, n);
  $("cur").style.opacity = n >= cur[1].length && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
}

function render(t) {
  g.clearRect(0, 0, 180, 320);
  background(t);
  const dis = p(t, 4.2, .5);
  const e = dis < 1 ? enemy(t, dis) : { visible: false };
  const c = cat(t);
  projectile(t); sparks(t);
  // DOM sobre el píxel (alineado a la grilla de 6 px)
  $("bubbleTxt").style.left = (e.x + 13) * 6 + "px"; $("bubbleTxt").style.top = (e.y + 1) * 6 + "px";
  $("bubbleTxt").style.opacity = e.visible && dis < .3 ? 1 : 0;
  const plE = outQ(p(t, .95, .3));
  $("plateE").style.opacity = plE * (1 - p(t, 4.5, .3));
  $("plateE").style.transform = `translateX(${Math.round((1 - plE) * -60 / 6) * 6}px)`;
  const hp = 1 - outQ(p(t, 3.45, .5));
  $("hpE").style.width = hp * 100 + "%";
  $("hpE").style.background = hp > .5 ? "#6fd08c" : hp > .2 ? "#f2d27a" : "#C8452C";
  $("zzz").style.transform = `translateY(${Math.round(Math.sin(t * 2) * 2) * 6}px)`;
  $("zzz").style.left = (c.cx + 8) * 6 + "px"; $("zzz").style.top = (c.cy - 40) * 6 + "px";
  $("flash").style.opacity = t > 3.35 && t < 3.47 ? .9 : 0;
  const s = p(t, 4.55, .12);
  $("seal").style.opacity = s > 0 ? 1 : 0;
  $("seal").style.transform = `scale(${s < 1 ? 2.2 - 1.2 * s : 1}) rotate(-6deg)`;
  dialog(t);
}

/* ---- Reproductor ---- */
const REC = new URLSearchParams(location.search).has("rec");
if (REC) document.body.classList.add("rec");
function fit() { if (REC) return; const vp = $("viewport").getBoundingClientRect(); const s = Math.min(vp.width / 1080, vp.height / 1920) * .96; $("stage").style.transform = `translate(${-540 * s}px, ${-960 * s}px) scale(${s})`; }
addEventListener("resize", fit);
let playing = !REC, t0 = performance.now(), now = 0;
function show(t) { now = t; render(t); $("scrub").value = t; $("time").textContent = t.toFixed(2) + " s"; }
function loop(ts) { if (playing) { let t = (ts - t0) / 1000; if (t > DURATION + .8) { t0 = ts; t = 0; } show(Math.min(t, DURATION)); } requestAnimationFrame(loop); }
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pausa" : "Reproducir"; t0 = performance.now() - now * 1000; };
$("scrub").oninput = () => { playing = false; $("play").textContent = "Reproducir"; show(+$("scrub").value); };
window.__seek = (t) => show(t);
window.__duration = DURATION;
window.__ready = document.fonts.load("54px DotGothic16").then(() => document.fonts.ready).then(() => { fit(); show(0); return true; });
window.__ready.then(() => { t0 = performance.now(); requestAnimationFrame(loop); });
</script>
</body>
</html>
