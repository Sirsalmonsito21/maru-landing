<script>

/* ---------- Maru acostada (caminando) ---------- */
function maruLoaf(face, t, walking) {

  if (walking) { const f = Math.floor(t * 8) % 2; [[-10, f], [-4, 1 - f], [5, f], [10, 1 - f]].forEach(([x, s]) => { rect(x - 1, 8 + s * 1 - bob, 3, 3, PAL.k); px(x, 8 + s - bob, PAL.w); }); }

}

/* ---------- Maru de pie con la camiseta roja #7 ---------- */
function limb(x0, y0, x1, y1, r, fill, out) {

/* ======================= MUNDO PRO ======================= */
const SV = "http://www.w3.org/2000/svg";

  if (word) {
    Object.assign(kw.style, { font: wStyle.font, color: wStyle.color, webkitTextStroke: wStyle.stroke, top: wStyle.top + "px", opacity: wk, letterSpacing: `${lerp(.4, .06, wk)}em`, transform: `scale(${1 + pk * .06})` });
    kw.style.textShadow = pk > .2 ? `${6 * pk}px 0 rgba(255,40,40,.5), ${-6 * pk}px 0 rgba(40,200,255,.5)` : "none";
  }

  // Etiqueta
  const cap = $("cap");
  const capTxt = ["UMI · restaurante nikkei", "AUREA · salón y spa", "VOLT · detailing de autos"];
  if (seg < 3 && t < 32.4) { const segStart = [12, 19.5, 27][seg]; const k = outQ(p(t, segStart + .5, .5)) * (1 - p(t, [19.2, 26.7, 32.2][seg], .25)); cap.style.opacity = k; cap.style.color = light ? "#2b2326" : "#efe6d4"; $("capI").textContent = `0${seg + 1} / 03`; $("capT").textContent = capTxt[seg]; cap.style.transform = `translateX(${(1 - k) * -30}px)`; }
  else cap.style.opacity = 0;

  // Dispositivos
  const none = null;
  let mon = none, lap = none, pho = none, tab = none, ult = none;
  if (seg === 0) {
    if (t < 15.75) {
      const e = outX(p(t, 12, 1.1)), push = io(p(t, 13.875, 1.0));
      mon = { x: 0, y: lerp(60, 20, e) - push * 40, z: lerp(-1800, 0, e) + push * 330, rx: 4, ry: lerp(42, -10, e) + (t - 12) * 1.5 + push * 6, s: 1, blur: (1 - e) * 16 };
      updUmi(SITES.umiMon, { hero: p(t, 12.25, 1.5), scroll: 900 * io(p(t, 14.0, 1.2)), cards: p(t, 14.55, 1.0), gal: 0 }, t);
    } else {
      const o = outQ(p(t, 15.75, .75)), orb = p(t, 15.75, 3.75), push = io(p(t, 17.625, 1.2));
      lap = { x: 0, y: 150 - push * 60, z: lerp(-500, -150, orb) + push * 260, rx: 16 - push * 8, ry: lerp(-28, 14, io(orb)), s: 1.0, blur: 0 };
      $("dLap").querySelector(".lid").style.transform = `rotateX(${-100 * (1 - o)}deg)`;
      updUmi(SITES.umiLap, { hero: 1, scroll: lerp(1735, 2440, io(p(t, 17.7, .9))), cards: 1, gal: (t - 15.75) * 170, pulse: (t * 1.2) % 1 * p(t, 18.5, .1) }, t);
    }
  }
  if (seg === 1) {
    const e = outX(p(t, 19.5, 1.0));
    const side = io(p(t, 25.125, .9));
    pho = { x: lerp(0, 190, side), y: lerp(420, -10, e) + Math.sin(t * 1.6) * 10, z: lerp(-600, 0, e) - side * 120, rx: 4, ry: lerp(-30, -12, e) + Math.sin(t * .8) * 4 - side * 8, rz: lerp(-6, 0, e), s: lerp(1.3, 1.1, side), blur: (1 - e) * 10 };
    // pantalla del celular
    const slide = io(p(t, 21.375, .5)) * (1 - io(p(t, 25.125, .5)));
    let tap = null;
    const tapAt = (tt, x, y) => { const k = p(t, tt - .15, .45); if (k > 0 && k < 1) tap = [x, y, Math.sin(k * Math.PI), 1.3 - .5 * Math.sin(k * Math.PI)]; };
    tapAt(21.2, 195, 710);
    tapAt(22.1, 390 + 24 + 6 * 49 + 20, 54 + 10 + 280 + 4 * 44 + 18);
    tapAt(22.65, 390 + 24 + 2 * 119 + 50, 54 + 590 + 20);
    tapAt(23.05, 390 + 195, 54 + 680);
    if (tap && tap[0] > 390) tap[0] -= 390 * slide;
    updAurea(SITES.aurPho, { hero: p(t, 19.6, 1.4), slide, day: p(t, 22.1, .3), time: p(t, 22.65, .3), press: p(t, 23.0, .25), toast: p(t, 23.25, .4) * (1 - p(t, 25.0, .3)), tap }, t);
    if (t >= 25.125) {
      const te = outX(p(t, 25.125, .9));
      tab = { x: lerp(-700, -170, te), y: 40 + Math.sin(t * 1.3) * 8, z: -60, rx: 4, ry: lerp(40, 14, te), s: 1.05, blur: (1 - te) * 10 };
      updAureaT(SITES.aurTab, { scroll: 320 * io(p(t, 25.7, 1.1)) });
    }
  }
  if (seg === 2) {
    if (t < 32.625) {
      const e = outX(p(t, 27, 1.0)), push = io(p(t, 28.875, 1.0));
      ult = { x: lerp(500, 0, e), y: 0, z: lerp(-1400, 0, e) + push * 120, rx: 3, ry: lerp(-60, 8, e) - push * 6 + (t - 27) * -.8, s: 1.02, blur: (1 - e) * 14 };
      updVolt(SITES.voltU, { hero: p(t, 27.15, 1.2), scroll: io(p(t, 28.95, .7)) * 590 + io(p(t, 30.8, .7)) * 680, slider: lerp(.12, .88, io(p(t, 29.5, 1.2))), packs: p(t, 31.2, .9) }, t);
    } else {
      // Pared final con las 3 webs
      const w = io(p(t, 32.625, .9)), back = p(t, 32.625, 1.9);
      ult = { x: 0, y: lerp(0, -420, w), z: -back * 160, rx: 2, ry: 0, s: lerp(1.02, .9, w) };
      mon = { x: lerp(-800, -230, w), y: 250, z: -back * 160, rx: 2, ry: 16, s: .58, off: 1 - p(t, 33.0, .25) };
      pho = { x: lerp(800, 280, w), y: 230, z: -back * 160, rx: 2, ry: -16, s: .52, off: 1 - p(t, 33.4, .25) };
      updVolt(SITES.voltU, { hero: 1, scroll: 0, slider: .88, packs: 1 }, t);
      updUmi(SITES.umiMon, { hero: 1, scroll: 0, cards: 1, gal: 0 }, t);
      updAurea(SITES.aurPho, { hero: 1, slide: 0, day: 1, time: 1, press: 0, toast: 0, tap: null }, t);
    }
  }
  setDev("dMon", mon); setDev("dLap", lap); setDev("dPho", pho); setDev("dTab", tab); setDev("dUlt", ult);
}

/* ======================= EXPLOSIÓN DE PÍXELES ======================= */
const FX = $("fx"), gf = FX.getContext("2d");
let SNAP = null;
function snapshot() {
  if (SNAP) return SNAP;
  renderPixel(11.99);
  const d = MAIN.getImageData(0, 0, 180, 320).data, parts = [];
  for (let y = 0; y < 320; y += 2) for (let x = 0; x < 180; x += 2) { const i = (y * 180 + x) * 4; parts.push({ x: x * 6 + 6, y: y * 6 + 6, c: `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`, r: hash(x * 7 + y * 13), q: hash(x * 3 + y * 5 + 1) }); }
  return (SNAP = parts);
}
function renderFx(t) {
  gf.clearRect(0, 0, 1080, 1920);
  if (t < DROP || t > DROP + .9) return;
  const k = p(t, DROP, .85), parts = snapshot();
  parts.forEach((q) => {
    const kk = clamp((k - q.q * .15) / .85); if (kk <= 0) { gf.fillStyle = q.c; gf.fillRect(q.x - 6, q.y - 6, 12, 12); return; }
    const z = 1 + kk * kk * (5 + q.r * 9), dx = q.x - 540, dy = q.y - 900;
    const x = 540 + dx * z + (q.r - .5) * 300 * kk, y = 900 + dy * z + (q.q - .5) * 300 * kk, s = 12 * (1 + kk * 3 * q.r);
    gf.globalAlpha = 1 - kk; gf.fillStyle = q.c; gf.fillRect(x - s / 2, y - s / 2, s, s);
  });
  gf.globalAlpha = 1;
}

/* ======================= mini Maru del cierre ======================= */
const MINI = $("mini").getContext("2d");
function renderMini(t) {
  const w = $("miniwrap");
  const up = io(p(t, 35.6, .45)) * (1 - io(p(t, 37.5, .4)));
  w.style.opacity = t > 35.4 ? 1 : 0;
  if (t <= 35.4) return;
  const old = g; g = MINI; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 60, 80);
  const lt = t < 36.9 ? (t * 1) % .8 : 2.9;
  drawStand(30, 78 + (1 - up) * 70, t < 36.9 ? poseAt(lt, t) : poseAt(3.0, t), t, 1.5);
  g = old;
}

/* ======================= RENDER ======================= */
function render(t) {
  // pixel
  const pxOn = t < DROP;
  $("pxwrap").style.display = pxOn ? "block" : "none";
  if (pxOn) renderPixel(t);
  let shx = 0, shy = 0;
  if (t > 5 && t < 8) { const a = p(t, 5, 3) * 7; shx = (hash(Math.floor(t * 30)) - .5) * a * 2; shy = (hash(Math.floor(t * 30) + 7) - .5) * a * 2; }
  if (t > 11.7 && t < 12) { const a = 10; shx = (hash(Math.floor(t * 40)) - .5) * a; }
  const squeeze = t > 11.7 && t < 12 ? 1 + p(t, 11.7, .3) * .06 : 1;
  $("pxwrap").style.transform = `translate(${shx}px, ${shy}px) scale(${squeeze})`;

  // Notificación: visible desde el primer cuadro hasta que entra a la cueva
  const nOut = p(t, 4.1, .3), n = $("notif");
  n.style.opacity = t < 4.4 ? 1 - nOut : 0;
  n.style.transform = `translateY(${-nOut * 40 + (t < .25 ? Math.sin(t * 60) * 6 : 0)}px)`;
  const dist = Math.max(0, Math.round(12 - 12 * p(t, 0, 3.2)));
  $("nD").textContent = dist > 0 ? dist + " m" : "¡AQUÍ!";
  $("nM").style.width = (8 + 92 * p(t, 0, 3.2)) + "%";
  n.querySelector(".ic").style.background = Math.floor(t * 4) % 2 ? "#f2d27a" : "#C8452C";
  // "!" sobre Maru
  const bang = $("bang"); const bOn = t > 3.2 && t < 3.8;
  bang.style.opacity = bOn ? 1 : 0; bang.style.left = (73.6 - 4) * 6 - 30 + "px"; bang.style.top = (GY - 60) * 6 + "px";
  bang.style.transform = `scale(${bOn ? 1 + .3 * Math.exp(-(t - 3.2) * 10) : 1})`;

  // Baile: textos
  const sk = $("skill"), skOn = t >= 8.6 && t < 12;
  sk.style.opacity = skOn ? 1 : 0;
  const full = "¡NUEVA HABILIDAD: DESARROLLO WEB!";
  $("skT").textContent = full.slice(0, Math.floor(Math.max(0, t - 8.75) * 30));
  const siu = $("siu"); siu.style.opacity = skOn ? 1 : 0;
  const land = p(t, 11.4, .15);
  const beat = Math.abs(Math.sin((t - 8.6) * Math.PI * 2.6));
  siu.style.transform = `scale(${(.85 + beat * .08) * (1 + land * .35)}) rotate(${land ? -4 : Math.sin(t * 5) * 2}deg)`;
  siu.textContent = t < 11.4 ? "SIUUU" : "SIUUUU!";

  // flash del drop y entre webs
  let fl = 0;
  if (t >= DROP && t < DROP + .12) fl = 1 - p(t, DROP, .12);
  [19.5, 27].forEach((b) => { if (t >= b && t < b + .14) fl = Math.max(fl, .9 * (1 - p(t, b, .14))); });
  if (t >= 7.9 && t < 8.6) fl = Math.max(fl, .0);
  $("flash").style.opacity = fl;

  renderPro(t);
  renderFx(t);

  // Cierre
  const c = $("cta"), ck = outQ(p(t, 34.5, .45));
  c.style.opacity = ck;
  const inn = c.querySelector(".in").children;
  [...inn].forEach((el, i) => { const k = outX(p(t, 34.7 + i * .3, .5)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 40}px)`; });
  const pulse = p(t, 35.6, 2.4); c.querySelector(".c b").style.boxShadow = `0 0 0 ${((t * 1.4) % 1) * 22 * (pulse > 0 ? 1 : 0)}px rgba(215,185,140,${.5 * (1 - (t * 1.4) % 1)})`;
  renderMini(t);
}

/* ---------- Reproductor ---------- */
const REC = new URLSearchParams(location.search).has("rec");
if (REC) document.body.classList.add("rec");
function fit() { if (REC) return; const vp = $("viewport").getBoundingClientRect(); const s = Math.min(vp.width / 1080, vp.height / 1920) * .96; $("stage").style.transform = `translate(${-540 * s}px, ${-960 * s}px) scale(${s})`; }
addEventListener("resize", fit);
$("scrub").max = DURATION;
let playing = !REC, t0 = performance.now(), now = 0;
function show(t) { now = t; render(t); $("scrub").value = t; $("time").textContent = t.toFixed(2) + " / " + DURATION.toFixed(1) + " s"; }
function loop(ts) { if (playing) { let t = (ts - t0) / 1000; if (t >= DURATION) { t0 = ts; t = 0; } show(t); } requestAnimationFrame(loop); }
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pausa" : "Reproducir"; t0 = performance.now() - now * 1000; };
$("scrub").oninput = () => { playing = false; $("play").textContent = "Reproducir"; show(+$("scrub").value); };
window.__seek = (t) => show(t);
window.__duration = DURATION;
const FONTS = ["52px DotGothic16", "40px 'Tenor Sans'", "500 40px 'Cormorant Garamond'", "italic 500 40px 'Cormorant Garamond'", "500 40px 'Bodoni Moda'", "italic 500 40px 'Bodoni Moda'", "400 20px Manrope", "700 20px Manrope", "800 40px Unbounded", "400 20px 'Space Grotesk'", "700 20px 'Space Grotesk'"];
window.__ready = Promise.all(FONTS.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => { fit(); snapshot(); show(0); return true; });
window.__ready.then(() => { t0 = performance.now(); requestAnimationFrame(loop); });
</script>
