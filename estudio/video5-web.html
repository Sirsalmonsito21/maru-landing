  bang.style.transform = `scale(${bOn ? 1 + .35 * Math.exp(-(t - 3.1) * 10) : 1})`;

  const sk = $("skill"), skOn = t >= 8.6 && t < 12;
  sk.style.opacity = skOn ? 1 : 0;
  $("skT").textContent = "¡NUEVA HABILIDAD: DESARROLLO WEB!".slice(0, Math.floor(Math.max(0, t - 8.75) * 30));
  const siu = $("siu"); siu.style.opacity = skOn ? 1 : 0;
  const land = p(t, 11.4, .15), beat = Math.abs(Math.sin((t - 8.6) * Math.PI * 2.6));
  siu.style.transform = `scale(${(.85 + beat * .08) * (1 + land * .4)}) rotate(${land ? -4 : Math.sin(t * 5) * 2}deg)`;
  siu.style.color = t >= 11.4 && Math.floor(t * 20) % 2 ? "#fff6ee" : "#f2d27a";
  siu.textContent = t < 11.4 ? "SIUUU" : "SIUUUU!";

  let fl = 0;
  if (t >= DROP && t < DROP + .12) fl = 1 - p(t, DROP, .12);
  [18, 24.1, 30].forEach((b) => { if (t >= b && t < b + .14) fl = Math.max(fl, .9 * (1 - p(t, b, .14))); });
  BEATS.forEach((b) => { if (t >= b && t < b + .07) fl = Math.max(fl, .22); });
  $("flash").style.opacity = fl;

  renderPro(t);
  renderFx(t);

  const c = $("cta"), ck = outQ(p(t, 33.4, .45));
  c.style.opacity = ck;
  [...c.querySelector(".in").children].forEach((el, i) => { const k = outX(p(t, 33.6 + i * .3, .5)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 40}px)`; });
  const pl = ((t - 34.6) * 1.4) % 1; c.querySelector(".c b").style.boxShadow = t > 34.6 ? `0 0 0 ${pl * 24}px rgba(215,185,140,${.55 * (1 - pl)})` : "none";
  renderMini(t);
}

/* ---------- Reproductor ---------- */
const REC = new URLSearchParams(location.search).has("rec");
if (REC) document.body.classList.add("rec");
function fit() { if (REC) return; const vp = $("viewport").getBoundingClientRect(); const s = Math.min(vp.width / 1080, vp.height / 1920) * .96; $("stage").style.transform = `translate(${-540 * s}px, ${-960 * s}px) scale(${s})`; }
addEventListener("resize", fit);
$("scrub").max = DURATION;
let playing = !REC, t0 = performance.now(), now = 0;
function show(t) { now = t; render(t); $("scrub").value = t; $("time").textContent = t.toFixed(2) + " / " + DURATION.toFixed(1) + " s"; }
function loop(ts) { if (playing) { let t = (ts - t0) / 1000; if (t >= DURATION) { t0 = ts; t = 0; } show(t); } requestAnimationFrame(loop); }
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pausa" : "Reproducir"; t0 = performance.now() - now * 1000; };
$("scrub").oninput = () => { playing = false; $("play").textContent = "Reproducir"; show(+$("scrub").value); };
const FROM = +(new URLSearchParams(location.search).get("from") || 0);
window.__seek = (t) => show(t + FROM);
window.__duration = DURATION - FROM;
const FONTS = ["52px DotGothic16", "40px 'Tenor Sans'", "500 40px 'Shippori Mincho B1'", "600 40px 'Shippori Mincho B1'", "500 40px 'Bodoni Moda'", "italic 500 40px 'Bodoni Moda'", "400 20px Manrope", "700 20px Manrope", "800 20px Manrope", "800 40px Archivo", "900 40px Archivo"];
const PHOTOS = ["umi-hero", "umi-sushi", "umi-ceviche", "umi-interior", "aurea-hero", "aurea-facial", "volt-hero", "volt-dark"].map((n) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = F + n + ".jpg"; }));
window.__ready = Promise.all([...FONTS.map((f) => document.fonts.load(f)), ...PHOTOS]).then(() => document.fonts.ready).then(() => { fit(); snapshot(); show(0); return true; });
window.__ready.then(() => { t0 = performance.now(); requestAnimationFrame(loop); });
</script>
