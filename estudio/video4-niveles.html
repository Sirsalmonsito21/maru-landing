    ? "…mire le cuento… mi prima… en Surco… no tenía saldo… <em>¿cuánto el corte?</em>"
    : "«hola buenas mire le cuento que mi prima la que vive en Surco me dijo que ustedes atienden bien y justo el otro día pasaba por ahí y dije voy a preguntar pero no tenía saldo y entonces mi hermano me prestó el celular y le digo mire ¿cuánto el corte?»";

  /* Cierre */
  const cta = live.includes("cta") ? outQ(p(lt, .3, .25)) : 0;
  $("cta").style.opacity = cta;
  $("cta").style.transform = `scale(${.94 + .06 * cta})`;
  $("cta").querySelector(".opt").style.visibility = cta && Math.floor(lt * 3) % 3 === 2 ? "hidden" : "visible";

  /* Diálogo */
  $("textbox").style.opacity = st.card ? 0 : 1;
  const txt = st.card ? "" : st.text || "";
  const n = Math.floor(Math.max(0, lt - .15) * 24);
  $("txt").textContent = txt.slice(0, n);
  $("cur").style.opacity = txt && n >= txt.length && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
}

/* ======================= SONIDO ======================= */
function sfxTimeline() {
  const list = [];
  STEPS.forEach((s) => {
    if (s.sfx === "fight") {
      [.2, .28, .36, .44].forEach((a, k) => list.push({ n: "R/footstep0" + k, t: s.t0 + a, v: .7 }));
      for (let a = .6, k = 0; a < 2.85; a += .09 + hash(k) * .08, k++) list.push({ n: HITS[Math.floor(hash(k * 3.3) * HITS.length)], t: s.t0 + a, v: .55 + hash(k * 1.7) * .4 });
      list.push({ n: "I/drop_002", t: s.t0 + 2.9, v: .8 });
    } else if (s.sfx === "wave") {
      for (let a = .5, k = 1; a < 2.5; a += .2, k++) list.push({ n: "D/spaceTrash" + ((k % 5) + 1), t: s.t0 + a, v: .35 });
      list.push({ n: "D/phaseJump3", t: s.t0 + 1.9, v: .7 });
    } else (s.sfx || []).forEach(([n, at, v = 1]) => list.push({ n, t: s.t0 + at, v }));
    if (s.text && !s.card) for (let c = 0; c < s.text.length; c += 2) if (s.text[c] !== " ") list.push({ n: "I/tick_002", t: s.t0 + .15 + c / 24, v: .12 });
  });
  return list.filter((x) => x.t < DURATION);
}
const DIRS = { D: "kenney_digital-audio", I: "kenney_interface-sounds", R: "kenney_rpg-audio" };
window.__mix = async (base = "/videos/03-tipos-de-clientes/sonidos/") => {
  const SR = 48000, oc = new OfflineAudioContext(2, Math.ceil(DURATION * SR), SR);
  const list = sfxTimeline(), bufs = {};
  await Promise.all([...new Set(list.map((x) => x.n))].filter((n) => n !== "crickets").map(async (n) => {
    const [d, f] = n.split("/");
    const r = await fetch(`${base}${DIRS[d]}/Audio/${f}.ogg`);
    if (!r.ok) throw new Error("falta " + n);
    bufs[n] = await oc.decodeAudioData(await r.arrayBuffer());
  }));
  const bus = oc.createGain(); bus.gain.value = .9;
  const comp = oc.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  bus.connect(comp).connect(oc.destination);
  list.forEach(({ n, t, v }, k) => {
    const gn = oc.createGain(); gn.gain.value = v;
    const pan = oc.createStereoPanner(); pan.pan.value = n === "I/tick_002" ? 0 : (hash(k) - .5) * .5;
    gn.connect(pan).connect(bus);
    if (n === "crickets") {
      // Grillo: trenes de pulsos agudos, dos grillos desfasados
      [[4400, 0], [4750, .23]].forEach(([f, off]) => {
        const o = oc.createOscillator(); o.frequency.value = f; const a = oc.createGain(); a.gain.value = 0; o.connect(a).connect(gn);
        for (let c = 0; c < 3; c++) for (let q = 0; q < 3; q++) { const s0 = t + off + c * .5 + q * .045; a.gain.setValueAtTime(0, s0); a.gain.linearRampToValueAtTime(.16 * v, s0 + .008); a.gain.linearRampToValueAtTime(0, s0 + .03); }
        o.start(t + off); o.stop(t + off + 1.6);
      });
      return;
    }
    const src = oc.createBufferSource(); src.buffer = bufs[n]; src.connect(gn); src.start(t);
  });
  const out = await oc.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = out.getChannelData(c); for (let j = 0; j < d.length; j++) peak = Math.max(peak, Math.abs(d[j])); }
  const norm = peak > 0 ? .89 / peak : 1;
  const len = out.length, bytes = new DataView(new ArrayBuffer(44 + len * 4));
  const W = (o, s) => [...s].forEach((ch, j) => bytes.setUint8(o + j, ch.charCodeAt(0)));
  W(0, "RIFF"); bytes.setUint32(4, 36 + len * 4, true); W(8, "WAVE"); W(12, "fmt "); bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, 2, true);
  bytes.setUint32(24, SR, true); bytes.setUint32(28, SR * 4, true); bytes.setUint16(32, 4, true); bytes.setUint16(34, 16, true); W(36, "data"); bytes.setUint32(40, len * 4, true);
  const L = out.getChannelData(0), R = out.getChannelData(1);
  for (let j = 0; j < len; j++) { bytes.setInt16(44 + j * 4, clamp(L[j] * norm, -1, 1) * 32767, true); bytes.setInt16(46 + j * 4, clamp(R[j] * norm, -1, 1) * 32767, true); }
  window.__wav = new Uint8Array(bytes.buffer);
  return { bytes: window.__wav.length, sounds: list.length };
};
window.__wavChunk = (i, size = 300000) => { let s = ""; const a = window.__wav.subarray(i * size, (i + 1) * size); for (let j = 0; j < a.length; j++) s += String.fromCharCode(a[j]); return btoa(s); };

/* ---------- Reproductor ---------- */
const REC = new URLSearchParams(location.search).has("rec");
if (REC) document.body.classList.add("rec");
function fit() { if (REC) return; const vp = $("viewport").getBoundingClientRect(); const s = Math.min(vp.width / 1080, vp.height / 1920) * .96; $("stage").style.transform = `translate(${-540 * s}px, ${-960 * s}px) scale(${s})`; }
addEventListener("resize", fit);
$("scrub").max = DURATION;
let playing = !REC, t0 = performance.now(), now = 0;
function show(t) { now = t; render(t); $("scrub").value = t; $("time").textContent = t.toFixed(2) + " / " + DURATION.toFixed(1) + " s"; }
function loop(ts) { if (playing) { let t = (ts - t0) / 1000; if (t >= DURATION) { t0 = ts; t = 0; } show(t); } requestAnimationFrame(loop); }
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pausa" : "Reproducir"; t0 = performance.now() - now * 1000; };
$("scrub").oninput = () => { playing = false; $("play").textContent = "Reproducir"; show(+$("scrub").value); };
window.__seek = (t) => show(t);
window.__duration = DURATION;
window.__ready = document.fonts.load("52px DotGothic16").then(() => document.fonts.ready).then(() => { fit(); show(0); return true; });
window.__ready.then(() => { t0 = performance.now(); requestAnimationFrame(loop); });
