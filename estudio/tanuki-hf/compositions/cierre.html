<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Tenor Sans"; src: url("assets/fonts/TenorSans-Regular.ttf"); }
        @font-face { font-family: "Zen Kaku Gothic New"; font-weight: 500; src: url("assets/fonts/ZenKakuGothicNew-Medium.ttf"); }
        @font-face { font-family: "Zen Kaku Gothic New"; font-weight: 900; src: url("assets/fonts/ZenKakuGothicNew-Black.ttf"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #05070C; color: #F4F1EA; font-family: "Zen Kaku Gothic New", sans-serif; }
        #z-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; filter: blur(7px); opacity: .75; }
        #z-box { position: absolute; left: 70px; right: 130px; top: 330px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        #z-brand { display: flex; align-items: center; gap: 26px; opacity: 0; }
        #z-brand img { width: 120px; height: 120px; border-radius: 16px; }
        #z-brand span { font-family: "Tenor Sans", serif; font-size: 96px; letter-spacing: .18em; color: #F3DDB0; }
        #z-q { margin-top: 110px; font-size: 92px; font-weight: 900; line-height: 1.05; opacity: 0; }
        #z-q b { color: #F3DDB0; font-weight: 900; }
        #z-cta { margin-top: 90px; padding: 30px 50px; border-radius: 22px; background: #C8452C; font-size: 66px; font-weight: 900; color: #fff6ee; opacity: 0; box-shadow: 0 0 60px rgba(200,69,44,.55); }
        #z-free { margin-top: 36px; font-size: 44px; font-weight: 500; color: #F3DDB0; opacity: 0; text-shadow: 0 2px 12px #05070C; }
      </style>
      <div id="root" data-composition-id="cierre" data-width="1080" data-height="1920" data-duration="3.567">
        <canvas id="z-cv" width="1080" height="1920" data-layout-allow-overflow></canvas>
        <div id="z-box">
          <div id="z-brand"><img src="assets/img/sello-maru.png" alt="" /><span>MARU</span></div>
          <div id="z-q">Que tus clientes <b>no te olviden</b>.</div>
          <div id="z-cta">Comenta VUELVE ▼</div>
          <div id="z-free">asesoría gratis</div>
        </div>
      </div>
      <script>
        (function () {
        var cv = document.getElementById("z-cv"), g = cv.getContext("2d");
        var hash = function (n) { var s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
        var P = [];
        for (var i = 0; i < 700; i++) { var sd = i % 2 ? 1 : -1, u = hash(i + 1) * 2 - 1, th = hash(i + 2) * 6.283, q = Math.sqrt(1 - u * u);
          var rr = Math.sqrt(hash(i + 4)) * 1.6; P.push([Math.cos(th) * rr, (hash(i + 5) - .5) * .12 - (i % 7 ? 0 : hash(i + 6) * .5), Math.sin(th) * rr]); }
        function draw(t) {
          g.clearRect(0, 0, 1080, 1920);
          var a = t * .6, ca = Math.cos(a), sa = Math.sin(a);
          g.globalCompositeOperation = "lighter";
          for (var i = 0; i < P.length; i++) { var p = P[i], x = p[0] * ca + p[2] * sa, z = -p[0] * sa + p[2] * ca, y = p[1];
            var s = 520 / (4 + z), X = 540 + x * s * 1.1, Y = 1330 + (y + z * .38) * s * 1.1, r = 3 + (1.5 - z) * 1.5;
            g.fillStyle = i % 5 ? "rgba(243,221,176,.55)" : "rgba(255,244,222,.9)"; g.beginPath(); g.arc(X, Y, Math.max(1.5, r), 0, 6.283); g.fill(); }
          g.globalCompositeOperation = "source-over";
        }
        var tl = gsap.timeline({ paused: true });
        var clock = { t: 0 };
        tl.to(clock, { t: 3.567, duration: 3.567, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
        tl.fromTo("#z-cv", { opacity: 0 }, { opacity: .75, duration: .6, ease: "none" }, 0);
        tl.fromTo("#z-brand", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .5, ease: "expo.out" }, .1);
        tl.fromTo("#z-q", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .5, ease: "expo.out" }, .45);
        tl.fromTo("#z-cta", { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .4, ease: "back.out(2.2)" }, .9);
        tl.fromTo("#z-cta", { scale: 1 }, { scale: 1.07, duration: .275, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 1.65);
        tl.fromTo("#z-free", { opacity: 0 }, { opacity: 1, duration: .4, ease: "none" }, 1.2);
        draw(0);
        window.__timelines["cierre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
