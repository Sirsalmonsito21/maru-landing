<!doctype html>
<html>

  <body>

          background: linear-gradient(145deg, #fff3b8, #f2d27a 55%, #d9b04a); box-shadow: 0 0 60px 10px rgba(255,220,120,.4), 0 14px 0 #b88f1c; opacity: 0; }
        #r-wink { position: absolute; left: 150px; top: 520px; font-size: 90px; color: #f2d27a; opacity: 0;
          text-shadow: 5px 0 0 #1a1422, -5px 0 0 #1a1422, 0 5px 0 #1a1422, 0 -5px 0 #1a1422, 6px 8px 0 #1a1422; }
        #r-glow { position: absolute; left: 712px; top: 1478px; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
          background: radial-gradient(circle, #fff 0%, #fff3b8 30%, rgba(242,210,122,0) 70%); }

        <div id="r-glow" data-layout-allow-overflow></div>
        <div id="r-flash"></div>
      </div>
      <script>
        (function () {
        /*__ENGINE__*/
        var cv = document.getElementById("r-px"), ctx = cv.getContext("2d"), cam = document.getElementById("r-cam");
        function cleanOffice(t) {
          gradient(["#1a1624", "#221c2e"], 0, PH);
          tokyoWindow(20, 40, 230, 190, t + 30);
          rect(16, 36, 238, 4, "#3a3048"); rect(16, 230, 238, 6, "#3a3048");
          // planta y cuadro: oficina ordenada

          rect(40, 256, 50, 34, "#2a2236"); rect(44, 260, 42, 26, "#C8452C"); rect(58, 266, 14, 14, "#fff6ee");

            left: [-24, -34], right: [18, -84] }, t);

          for (var s = 0; s < 3; s++) { var ph = (t * 1.1 + s * .33) % 1; blob(hx + 2 + s * 5, hy - 10 - ph * 18, 2 + ph * 2, 2 + ph * 2, "rgba(255,255,255," + (.6 * (1 - ph)) + ")", null); }

          limb(110, 360, 200, 356, 9, KU.suit, KU.out); limb(112, 366, 214, 364, 9, KU.suitSh, KU.out);

        tl.fromTo("#r-wink", { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: .2, ease: "back.out(3)" }, 1.0);
        tl.to("#r-wink", { opacity: 0, duration: .15 }, 1.5);
        draw(0);
        window.__timelines["remate"] = tl;

</html>
