<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #111726; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #111726; }
      #grain-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
      @keyframes hf-grain-noise { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-5%, 5%); } 50% { transform: translate(5%, -5%); } 75% { transform: translate(-5%, -5%); } }
      #grain-overlay .grain-texture { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; opacity: .05;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        animation: hf-grain-noise .5s steps(1) 62; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31" data-width="1080" data-height="1920">
      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html" data-start="0" data-duration="2.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="problema" data-composition-id="problema" data-composition-src="compositions/problema.html" data-start="2.5" data-duration="2" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="foto" data-composition-id="foto" data-composition-src="compositions/foto.html" data-start="4.5" data-duration="2.5" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div id="bot" data-composition-id="bot" data-composition-src="compositions/bot.html" data-start="7" data-duration="3" data-track-index="4" data-width="1080" data-height="1920"></div>
      <div id="flujo" data-composition-id="flujo" data-composition-src="compositions/flujo.html" data-start="10" data-duration="5" data-track-index="5" data-width="1080" data-height="1920"></div>
      <div id="dashboard" data-composition-id="dashboard" data-composition-src="compositions/dashboard.html" data-start="15" data-duration="8" data-track-index="6" data-width="1080" data-height="1920"></div>
      <div id="aviso" data-composition-id="aviso" data-composition-src="compositions/aviso.html" data-start="23" data-duration="2.5" data-track-index="7" data-width="1080" data-height="1920"></div>
      <div id="resultado" data-composition-id="resultado" data-composition-src="compositions/resultado.html" data-start="25.5" data-duration="2" data-track-index="8" data-width="1080" data-height="1920"></div>
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html" data-start="27.5" data-duration="3.5" data-track-index="9" data-width="1080" data-height="1920"></div>
      <div id="grain-overlay"><div class="grain-texture"></div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
