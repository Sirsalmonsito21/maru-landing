          blob(x, y, 7 * k, 6.5 * k, "#6b3e1f", "#3e2210", "#4e2c14", "#9a6030");
          for (var i = 0; i < 5; i++) px(x - 3 * k + i * 1.5 * k, y - 2 * k + (i % 2) * k, "#3e2210");
        }
        function glassesFalling(x, y, k, f) {
          var rot = f * 1.2;
          g.save(); g.translate(x, y); g.rotate(rot);
          rect(-11 * k, -1 * k, 22 * k, 1.4 * k, "#0b0915");
          blob(-5.5 * k, 1.4 * k, 5 * k, 3.4 * k, "#07060d", "#0b0915"); blob(5.5 * k, 1.4 * k, 5 * k, 3.4 * k, "#07060d", "#0b0915");
          line(-8 * k, .6 * k, -5 * k, -.6 * k, "#6f7fd0", 3);
          g.restore();
        }
        function waveCrash(t) {
          // Ola viva: sube detrás, rompe con cresta y espuma, arrastra a Kuro y se retira. Solo cubre la mitad baja.
          var H = 150 * outQ(pk(t, 8.4, .4)) * (1 - outQ(pk(t, 9.28, .42)));
          var front = lerp(330, -140, Math.pow(pk(t, 8.72, .62), 1.15));
          var base = 350 + 60 * pk(t, 9.28, .42);
          if (H < 1) return null;
          var top = function (x) {
            var d = x - front;
            if (d < -6) return 9999;
            var prof = d < 26 ? Math.sqrt(Math.max(0, d + 6) / 32) : 1 - Math.min(.55, (d - 26) / 520);
            return base - H * prof + Math.sin(x * .09 + t * 7) * 3 + Math.sin(x * .23 - t * 11) * 1.5;
          };
          for (var x = 0; x < PW; x++) {
            var ty = top(x); if (ty > PH) continue;
            for (var y = Math.floor(ty); y < PH; y++) {
              var dep = y - ty, c;
              if (dep < 3) c = "#f4fbff";
              else if (dep < 7) c = ((x + y) & 3) ? "#bdf1f2" : "#f4fbff";
              else if (dep < 18) c = "#6fd3dc";
              else if (dep < 40) c = "#2fb3c7";
              else if (dep < 80) c = (dep - 40) * 16 / 40 > BAYER[y & 3][x & 3] ? "#1f7f9c" : "#2fb3c7";
              else c = (dep - 80) * 16 / 60 > BAYER[y & 3][x & 3] ? "#15506f" : "#1f7f9c";
              var band = (y - ty + Math.sin(x * .06 + t * 4) * 5 + t * 18) % 16;
              if (dep > 14 && band < 1.2) c = dep < 60 ? "#8fe3ea" : "#3fb7c9";
              px(x, y, c);
            }
          }
          // labio de la cresta que se curva hacia adelante
          var cx0 = front + 4, cy0 = base - H - 4;
          for (var i = 0; i < 26; i++) { var a = Math.PI * (1.05 + i / 26 * .9), r = 16 + (i % 3); var lx = cx0 + Math.cos(a) * r * .9 + 14, ly = cy0 + Math.sin(a) * r * .7 + 10; rect(lx, ly, 3, 3, i % 4 ? "#f4fbff" : "#bdf1f2"); }
          // spray
          for (var s = 0; s < 46; s++) {
            var k = (t * 1.6 + hash(s)) % 1, sx = front + (hash(s + 3) - .2) * 80, sy = base - H - k * 70 * hash(s + 7) + k * k * 60;
            if (sx > 0 && sx < PW) rect(sx, sy, 2, 2, s % 3 ? "#f4fbff" : "#8fe3ea");
          }
          return { top: top, front: front, H: H, base: base };
        }

        function update(t) {
          scene(t);
          // tipeo en el chat de Maru
          if (t >= 12.3 && t < 13.15) { var n = Math.floor(pk(t, 12.3, .8) * TYPE.length); typed.textContent = TYPE.slice(0, n); }
          else typed.textContent = "";
          car.style.opacity = (t >= 11 && Math.floor(t * 3) % 2 === 0) || (t >= 12.3 && t < 13.15) ? 1 : 0;
          drawSticker(stkMini, t, false);
          drawSticker(stkBig, t, t >= 16.8);
        }

        var tl = gsap.timeline({ paused: true });
        var proxy = { t: 0 };
        tl.to(proxy, { t: 17.11, duration: 17.11, ease: "none", onUpdate: function () { update(proxy.t); } }, 0);

        // Gancho arriba
        tl.fromTo("#playa-hook", { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: .3, ease: "power2.in" }, 6.0);

        // Chat con el empleado
        tl.set("#playa-dim", { opacity: 0 }, 0);
        tl.to("#playa-dim", { opacity: .55, duration: .3 }, 1.55);
        tl.fromTo("#playa-chatA", { opacity: 0, y: 260, scale: .92 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: "back.out(1.6)" }, 1.6);
        tl.set("#playa-a1", { display: "block" }, 1.9);
        tl.fromTo("#playa-a1", { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .3, ease: "back.out(2)", transformOrigin: "100% 100%" }, 1.9);
        tl.set("#playa-stA", { textContent: "escribiendo…" }, 3.9);
        tl.set("#playa-a2", { display: "flex" }, 3.9);
        tl.fromTo("#playa-a2 i", { y: 0 }, { y: -10, duration: .18, stagger: .09, yoyo: true, repeat: 4, ease: "sine.inOut" }, 3.95);
        tl.set("#playa-a2", { display: "none" }, 4.8);
        tl.set("#playa-stA", { textContent: "en línea" }, 4.8);
        tl.set("#playa-a3", { display: "block" }, 4.8);
        tl.fromTo("#playa-a3", { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .32, ease: "back.out(2)", transformOrigin: "0% 100%" }, 4.8);
        tl.to("#playa-chatA", { opacity: 0, y: 200, duration: .25, ease: "power2.in" }, 6.05);
        tl.to("#playa-dim", { opacity: 0, duration: .25 }, 6.05);

        // BONK
        tl.fromTo("#playa-bonk", { opacity: 0, scale: .3, rotation: -12 }, { opacity: 1, scale: 1, rotation: -6, duration: .22, ease: "back.out(3)" }, 7.62);
        tl.to("#playa-bonk", { opacity: 0, duration: .15 }, 8.25);
        // ¡¡!! del pellizco
        tl.fromTo("#playa-ouch", { opacity: 0, scale: .4 }, { opacity: 1, scale: 1, duration: .18, ease: "back.out(3)" }, 10.35);
        tl.to("#playa-ouch", { opacity: 0, duration: .15 }, 10.7);

        // Chat con Maru
        tl.to("#playa-dim", { opacity: .5, duration: .3 }, 10.95);
        tl.fromTo("#playa-chatB", { opacity: 0, y: 260, scale: .92 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: "back.out(1.6)" }, 11.0);
        tl.set("#playa-b1", { display: "block" }, 11.3);
        tl.fromTo("#playa-b1", { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .3, ease: "back.out(2.4)", transformOrigin: "100% 100%" }, 11.3);
        tl.fromTo("#playa-b1", { x: -8 }, { x: 8, duration: .05, repeat: 9, yoyo: true, ease: "none" }, 11.6);
        tl.set(["#playa-b2", "#playa-b3"], { display: "block" }, 13.15);
        tl.fromTo("#playa-b2", { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .3, ease: "back.out(2.6)", transformOrigin: "0% 100%" }, 13.15);
        tl.fromTo("#playa-b3", { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .34, ease: "back.out(2)", transformOrigin: "0% 100%" }, 13.25);
        tl.fromTo("#playa-b3 path:last-of-type", { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: .7, ease: "power2.out" }, 13.35);
        tl.set("#playa-b4", { display: "block" }, 14.1);
        tl.fromTo("#playa-b4", { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .28, ease: "back.out(2.4)", transformOrigin: "100% 100%" }, 14.1);
        // corte a la cara (mini-drop 1) y vuelta al chat con el sticker
        // Mini-drops: 15.05 cara, 15.20 más cerca, 16.00 el sticker, 16.60 zoom al sticker y a la pupila
        tl.set(["#playa-chatB", "#playa-dim"], { opacity: 0 }, 15.05);
        tl.set("#playa-flash", { opacity: 0 }, 0);
        [15.05, 15.2, 16.0, 16.6].forEach(function (b, j) { tl.fromTo("#playa-flash", { opacity: j === 1 || j === 3 ? .35 : .8 }, { opacity: 0, duration: .09, ease: "none", immediateRender: false }, b); });
        tl.fromTo("#playa-big", { opacity: 0, scale: .3, rotation: -10 }, { opacity: 1, scale: 1, rotation: 0, duration: .35, ease: "back.out(2.2)" }, 16.0);
        tl.fromTo("#playa-biglab", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .3, ease: "expo.out" }, 16.05);
        tl.to("#playa-big", { y: -14, duration: .25, ease: "sine.inOut" }, 16.35);
        tl.to("#playa-biglab", { opacity: 0, duration: .05 }, 16.6);
        tl.to("#playa-big", { y: 0, scale: 3.1, transformOrigin: "65.3% 53.2%", duration: .06, ease: "expo.out" }, 16.6);
        tl.to("#playa-big", { scale: 5.2, transformOrigin: "65.4% 53.4%", duration: .32, ease: "power1.inOut" }, 16.66);
        tl.to("#playa-big", { scale: 48, transformOrigin: "65.6% 53.8%", duration: .13, ease: "expo.in" }, 16.98);
        tl.fromTo("#playa-black", { opacity: 0 }, { opacity: 1, duration: .08, ease: "none" }, 17.03);

        update(0);
        window.__timelines["playa"] = tl;
        })();
      </script>
    </template>
